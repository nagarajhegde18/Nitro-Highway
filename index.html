<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Endless Drive</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-wrap">
    <canvas id="game" width="400" height="600"></canvas>

    <div id="hud">
      <div class="row">
        <span>Score <b id="score">0</b></span>
        <span>Best <b id="best">0</b></span>
        <span>🪙 <b id="coins">0</b></span>
      </div>
      <div class="bars">
        <div class="bar"><span>⛽</span><div class="track"><div id="fuelFill" class="fill fuel"></div></div></div>
        <div class="bar"><span>⚡</span><div class="track"><div id="nitroFill" class="fill nitro"></div></div></div>
      </div>
    </div>

    <button id="nitroBtn">NITRO</button>

    <div id="overlay">
      <h1 id="title">Endless Drive</h1>
      <p id="msg">
        Steer: ← → or A / D (or press left/right side of the screen)<br>
        Nitro: hold Shift (or the NITRO button)<br>
        Collect 🪙 coins to fill nitro and ⛽ fuel to keep driving
      </p>
      <p class="label">Choose your car</p>
      <div id="skins"></div>
      <button id="startBtn">Start</button>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
